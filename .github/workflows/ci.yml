# Type-checks and tests the mobile app on every push and pull request.
name: CI

on:
  push:
    branches: [develop, qa, main, feat/trip-phase1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend-movil/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --ci
